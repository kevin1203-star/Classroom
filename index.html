<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orario 3AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f2f2f7; color: #000; display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 430px; height: 100vh; background: #f8f8fa; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .header { padding: 20px 20px 10px 20px; display: flex; justify-content: space-between; align-items: flex-start; background: #f8f8fa; }
    .header-titles h1 { font-size: 26px; font-weight: 700; color: #000; }
    .header-titles p { font-size: 14px; color: #8e8e93; margin-top: 2px; }
    .badge-live { background: #e8f5e9; color: #2e7d32; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 12px; display: flex; align-items: center; gap: 5px; }
    .badge-live::before { content: ""; display: inline-block; width: 6px; height: 6px; background-color: #2e7d32; border-radius: 50%; }
    .page { flex: 1; overflow-y: auto; padding: 10px 20px 80px 20px; display: none; }
    .page.active { display: block; }
    .card { width: 100%; height: 380px; border-radius: 28px; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); background-size: cover; background-position: center; transition: background-image 0.5s ease; }
    .card-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.75) 100%); z-index: 1; }
    .card-top { position: relative; z-index: 2; display: flex; justify-content: space-between; }
    .pill { background: rgba(255, 255, 255, 0.9); color: #000; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; backdrop-filter: blur(10px); }
    .pill-clock { background: #1b5e20; color: #fff; display: flex; align-items: center; gap: 5px; }
    .card-bottom { position: relative; z-index: 2; color: #fff; padding-bottom: 10px; }
    .card-subtext { font-size: 14px; opacity: 0.9; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .card-title { font-size: 28px; font-weight: 700; line-height: 1.2; }
    .card-location { font-size: 13px; color: #ffd700; margin-top: 4px; font-weight: 600; }
    .controls-container { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
    .nav-bar-mini { background: #eef0f4; border-radius: 20px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .btn-nav-mini { border: none; background: transparent; font-size: 14px; font-weight: 600; color: #000; cursor: pointer; }
    .nav-center-text { font-size: 12px; color: #8e8e93; }
    .btn-main-action { width: 100%; background: #fff; border: 1px solid #e5e5ea; padding: 14px; border-radius: 20px; font-size: 15px; font-weight: 600; color: #000; display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .day-section { margin-bottom: 20px; }
    .day-header { font-size: 18px; font-weight: 700; margin-bottom: 10px; color: #000; }
    .slot-card { background: #f0f2f6; border-radius: 16px; padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .slot-time-col { display: flex; flex-direction: column; }
    .slot-number { font-weight: 700; font-size: 14px; }
    .slot-hours { font-size: 12px; color: #8e8e93; }
    .slot-info-col { text-align: right; }
    .slot-subject { font-weight: 700; font-size: 14px; text-transform: uppercase; }
    .slot-room { font-size: 12px; color: #8e8e93; }
    .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 65px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-top: 1px solid #e5e5ea; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; z-index: 10; }
    .tab-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #8e8e93; font-size: 11px; font-weight: 500; cursor: pointer; background: none; border: none; width: 45%; }
    .tab-item.active { color: #2e7d32; }
    .tab-icon { font-size: 18px; }
    .modal { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 20; display: none; justify-content: center; align-items: flex-end; }
    .modal.open { display: flex; }
    .modal-content { background: #fff; width: 100%; border-radius: 24px 24px 0 0; padding: 20px; box-shadow: 0 -5px 25px rgba(0,0,0,0.1); }
    .modal-content h3 { margin-bottom: 15px; font-size: 16px; }
    .select-group { margin-bottom: 12px; }
    .select-group label { display: block; font-size: 12px; color: #8e8e93; margin-bottom: 4px; }
    .select-group select { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid #e5e5ea; background: #f8f8fa; font-size: 14px; }
    .modal-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; background: #2e7d32; color: white; font-weight: 600; margin-top: 10px; cursor: pointer; }
    .modal-btn-cancel { background: transparent; color: #eb4d4b; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <div class="header-titles">
        <h1 id="page-title">Orario 3AI</h1>
        <p id="page-subtitle">Lezione in tempo reale</p>
      </div>
      <div class="badge-live" id="live-badge">LIVE</div>
    </div>

    <div class="page active" id="page-now">
      <div class="card" id="main-card">
        <div class="card-overlay"></div>
        <div class="card-top">
          <div class="pill" id="card-pill-date">Lunedì · Ore 08:00</div>
          <div class="pill pill-clock" id="card-pill-clock">🕒 00:00:00</div>
        </div>
        <div class="card-bottom">
          <div class="card-subtext" id="card-subtext">📍 BRIXTON</div>
          <div class="card-title" id="card-title">INGLESE</div>
          <div class="card-location" id="card-location">📍 Piano Primo - Corridoio blu (Aula 158)</div>
        </div>
      </div>

      <div class="controls-container">
        <div class="nav-bar-mini">
          <button class="btn-nav-mini" onclick="changeHour(-1)">&lt; Prec.</button>
          <span class="nav-center-text" id="nav-center-text">Nessuna lezione</span>
          <button class="btn-nav-mini" onclick="changeHour(1)">Succ. &gt;</button>
        </div>
        <button class="btn-main-action" onclick="openModal()">📅 Cambia Giorno / Ora</button>
        <button class="btn-main-action" id="btn-reset-live" style="display:none; color: #2e7d32;" onclick="resetToLive()">⏱ Torna all'ora corrente</button>
      </div>
    </div>

    <div class="page" id="page-week">
      <div id="week-schedule-container"></div>
    </div>

    <div class="modal" id="timeModal">
      <div class="modal-content">
        <h3>Seleziona Giorno e Ora</h3>
        <div class="select-group">
          <label>Giorno</label>
          <select id="modal-select-day">
            <option value="1">Lunedì</option>
            <option value="2">Martedì</option>
            <option value="3">Mercoledì</option>
            <option value="4">Giovedì</option>
            <option value="5">Venerdì</option>
            <option value="6">Sabato</option>
          </select>
        </div>
        <div class="select-group">
          <label>Ora</label>
          <select id="modal-select-hour">
            <option value="8">1ª Ora (08:00)</option>
            <option value="9">2ª Ora (09:00)</option>
            <option value="10">3ª Ora (10:00)</option>
            <option value="11">4ª Ora (11:00)</option>
            <option value="12">5ª Ora (12:00)</option>
            <option value="13">6ª Ora (13:00)</option>
          </select>
        </div>
        <button class="modal-btn" onclick="applyModalSelection()">Conferma</button>
        <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Annulla</button>
      </div>
    </div>

    <div class="tab-bar">
      <button class="tab-item active" id="tab-btn-now" onclick="switchTab('now')">
        <span class="tab-icon">🕒</span>
        <span>Adesso</span>
      </button>
      <button class="tab-item" id="tab-btn-week" onclick="switchTab('week')">
        <span class="tab-icon">📅</span>
        <span>Settimana</span>
      </button>
    </div>
  </div>

  <script>
    const defaultOffImage = "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80";

    // Immagini caricate dall'utente
    const imgInglese = "https://i.ibb.co/5hZQWvrV/big-ben-a-66-1571680982.jpg";
    const imgInfo = "https://i.ibb.co/vCxNr7CD/1616683561166-1582717587391-technology-1283624-1920.jpg";
    const imgMatematica = "https://i.ibb.co/276DWHK0/1971614-inscritto-sulla-lavagna-con-formule-e-calcoli-scientifici-foto.jpg";
    const imgSistemi = "https://i.ibb.co/Pv6tBCKp/connessioni-internet.jpg";
    const imgTelecom = "https://i.ibb.co/JRpjxntc/retelit16.png";
    const imgTecnInfo = "https://i.ibb.co/1JhYHpHR/Le-tecnologie-per-la-sicurezza-informatica-scaled.jpg";
    const imgItaliano = "https://i.ibb.co/PvPXqWfz/Dante-Alighieri-678x381.jpg";
    const imgStoria = "https://i.ibb.co/B51YgMmQ/images-3.jpg";
    const imgIrc = "https://i.ibb.co/s71mkPN/35596436-simboli-di-religioni-e-confessioni-vicino-mani-di-persona-la-scelta-migliore-religione-per.jpg";
    const imgPalestra = "https://i.ibb.co/vCZBBR5v/IMG-20260924-WA0008.jpg";

    const schedule = {
      1: {
        8: { subject: "INGLESE", room: "BRIXTON", location: "📍 Piano Primo - Corridoio blu (Aula 158)", image: imgInglese },
        9: { subject: "SCIENZE MOTORIE", room: "PALESTRA", location: "📍 Tabella Oraria Palestre", image: imgPalestra },
        10: { subject: "MATEMATICA", room: "LIMITE", location: "📍 Piano Rialzato - Corridoio blu (Aula 077)", image: imgMatematica },
        11: { subject: "INFORMATICA", room: "LAB. INFO 5", location: "📍 Corridoio giallo 1° piano (Lab. Info 5)", image: imgInfo },
        12: { subject: "INFORMATICA", room: "LAB. INFO 5", location: "📍 Corridoio giallo 1° piano (Lab. Info 5)", image: imgInfo },
        13: { subject: "TECN. INFORMATICHE", room: "AULA 253", location: "📍 Piano Secondo - Corridoio verde (Aula 253)", image: imgTecnInfo }
      },
      2: {
        8: { subject: "SISTEMI E RETI", room: "LAB. INFO 8", location: "📍 Corridoio giallo 1° piano (Lab. Info 8)", image: imgSistemi },
        9: { subject: "SISTEMI E RETI", room: "LAB. INFO 8", location: "📍 Corridoio giallo 1° piano (Lab. Info 8)", image: imgSistemi },
        10: { subject: "INGLESE", room: "WIMBLEDON", location: "📍 Piano Primo - Corridoio blu (Aula 182)", image: imgInglese },
        11: { subject: "TELECOMUNICAZIONI", room: "AULA 295", location: "📍 Piano Secondo - Satellite (Aula 295)", image: imgTelecom },
        12: { subject: "ITALIANO", room: "MARGHERITA HACK", location: "📍 Piano Primo - Corridoio arancione (Aula 169)", image: imgItaliano },
        13: { subject: "INFORMATICA", room: "LAB. INFO 5", location: "📍 Corridoio giallo 1° piano (Lab. Info 5)", image: imgInfo }
      },
      3: {
        8: { subject: "TECN. INFORMATICHE", room: "LAB. INFO 5", location: "📍 Corridoio giallo 1° piano (Lab. Info 5)", image: imgTecnInfo },
        9: { subject: "MATEMATICA", room: "LIMITE", location: "📍 Piano Rialzato - Corridoio blu (Aula 077)", image: imgMatematica },
        10: { subject: "SISTEMI E RETI", room: "AULA 248", location: "📍 Piano Secondo - Corridoio verde (Aula 248)", image: imgSistemi },
        11: { subject: "ITALIANO", room: "MARGHERITA HACK", location: "📍 Piano Primo - Corridoio arancione (Aula 169)", image: imgItaliano },
        12: { subject: "INFORMATICA", room: "AULA 159", location: "📍 Piano Primo - Corridoio verde (Aula 159)", image: imgInfo },
        13: { subject: "STORIA", room: "MARGHERITA HACK", location: "📍 Piano Primo - Corridoio arancione (Aula 169)", image: imgStoria }
      },
      4: {
        8: { subject: "MATEMATICA", room: "LIMITE", location: "📍 Piano Rialzato - Corridoio blu (Aula 077)", image: imgMatematica },
        9: { subject: "TECN. INFORMATICHE", room: "AULA 295", location: "📍 Piano Secondo - Satellite (Aula 295)", image: imgTecnInfo },
        10: { subject: "IRC", room: "DON LORENZO MILANI", location: "📍 Piano Rialzato - Corridoio Sud (Aula 068)", image: imgIrc },
        11: { subject: "SCIENZE MOTORIE", room: "PALESTRA", location: "📍 Tabella Oraria Palestre", image: imgPalestra },
        12: { subject: "INGLESE", room: "BRIXTON", location: "📍 Piano Primo - Corridoio blu (Aula 158)", image: imgInglese }
      },
      5: {
        8: { subject: "INFORMATICA", room: "AULA 236", location: "📍 Piano Secondo - Corridoio verde (Aula 236)", image: imgInfo },
        9: { subject: "ITALIANO", room: "GRAZIA DELEDDA", location: "📍 Piano Secondo - Satellite (Aula 291)", image: imgItaliano },
        10: { subject: "ITALIANO", room: "GRAZIA DELEDDA", location: "📍 Piano Secondo - Satellite (Aula 291)", image: imgItaliano },
        11: { subject: "MATEMATICA", room: "INTEGRALE", location: "📍 Piano Rialzato - Corridoio blu (Aula 081)", image: imgMatematica },
        12: { subject: "SISTEMI E RETI", room: "AULA 248", location: "📍 Piano Secondo - Corridoio verde (Aula 248)", image: imgSistemi }
      },
      6: {
        8: { subject: "TELECOMUNICAZIONI", room: "LAB. ELETTRONICA", location: "📍 Corridoio blu 2° piano (Lab. Elettronica)", image: imgTelecom },
        9: { subject: "TELECOMUNICAZIONI", room: "LAB. ELETTRONICA", location: "📍 Corridoio blu 2° piano (Lab. Elettronica)", image: imgTelecom },
        10: { subject: "INFORMATICA", room: "AULA 159", location: "📍 Piano Primo - Corridoio verde (Aula 159)", image: imgInfo },
        11: { subject: "STORIA", room: "GRAZIA DELEDDA", location: "📍 Piano Secondo - Satellite (Aula 291)", image: imgStoria }
      }
    };

    const daysName = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
    let isManualMode = false, manualDay = null, manualHour = null;

    function getItalyTime() {
      const now = new Date();
      return new Date(now.toLocaleString("en-US", { timeZone: "Europe/Rome" }));
    }

    function initManualState() {
      if (!isManualMode) {
        const now = getItalyTime();
        manualDay = now.getDay();
        manualHour = now.getHours();
        isManualMode = true;
      }
    }

    function updateDisplay() {
      const now = getItalyTime();
      const currentDay = isManualMode ? manualDay : now.getDay();
      const currentHour = isManualMode ? manualHour : now.getHours();

      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
      document.getElementById('card-pill-clock').innerHTML = `🕒 ${timeStr}`;

      const hourFormatted = String(currentHour).padStart(2, '0');
      document.getElementById('card-pill-date').textContent = `${daysName[currentDay]} · Ore ${hourFormatted}:00`;

      const dayData = schedule[currentDay];
      const lesson = dayData ? dayData[currentHour] : null;

      const card = document.getElementById('main-card');
      const badge = document.getElementById('live-badge');
      const btnReset = document.getElementById('btn-reset-live');

      if (isManualMode) {
        badge.style.display = 'none';
        btnReset.style.display = 'flex';
      } else {
        badge.style.display = 'flex';
        btnReset.style.display = 'none';
      }

      if (lesson) {
        document.getElementById('card-subtext').textContent = `📍 ${lesson.room}`;
        document.getElementById('card-title').textContent = lesson.subject;
        document.getElementById('card-location').textContent = lesson.location;
        document.getElementById('card-location').style.display = 'block';
        card.style.backgroundImage = `url('${lesson.image}')`;
      } else {
        document.getElementById('card-subtext').textContent = `🌙 ${daysName[currentDay]} · Ore ${hourFormatted}:00`;
        document.getElementById('card-title').textContent = "Lezioni Terminate";
        document.getElementById('card-location').style.display = 'none';
        card.style.backgroundImage = `url('${defaultOffImage}')`;
      }
    }

    function changeHour(step) {
      initManualState();
      manualHour += step;
      if (manualHour > 23) {
        manualHour = 0;
        manualDay = (manualDay + 1) % 7;
      } else if (manualHour < 0) {
        manualHour = 23;
        manualDay = (manualDay - 1 + 7) % 7;
      }
      updateDisplay();
    }

    function resetToLive() {
      isManualMode = false;
      manualDay = null;
      manualHour = null;
      updateDisplay();
    }

    function openModal() { document.getElementById('timeModal').classList.add('open'); }
    function closeModal() { document.getElementById('timeModal').classList.remove('open'); }

    function applyModalSelection() {
      isManualMode = true;
      manualDay = parseInt(document.getElementById('modal-select-day').value);
      manualHour = parseInt(document.getElementById('modal-select-hour').value);
      closeModal();
      updateDisplay();
    }

    function switchTab(tab) {
      document.getElementById('page-now').classList.remove('active');
      document.getElementById('page-week').classList.remove('active');
      document.getElementById('tab-btn-now').classList.remove('active');
      document.getElementById('tab-btn-week').classList.remove('active');

      if (tab === 'now') {
        document.getElementById('page-now').classList.add('active');
        document.getElementById('tab-btn-now').classList.add('active');
        document.getElementById('page-title').textContent = "Orario 3AI";
        document.getElementById('page-subtitle').textContent = "Lezione in tempo reale";
      } else {
        document.getElementById('page-week').classList.add('active');
        document.getElementById('tab-btn-week').classList.add('active');
        document.getElementById('page-title').textContent = "Settimana";
        document.getElementById('page-subtitle').textContent = "Orario completo · 3AI";
        renderWeekSchedule();
      }
    }

    function renderWeekSchedule() {
      const container = document.getElementById('week-schedule-container');
      container.innerHTML = "";

      for (let day = 1; day <= 6; day++) {
        const daySection = document.createElement('div');
        daySection.className = "day-section";

        const dayHeader = document.createElement('div');
        dayHeader.className = "day-header";
        dayHeader.textContent = daysName[day];
        daySection.appendChild(dayHeader);

        const dayData = schedule[day];
        if (dayData) {
          Object.keys(dayData).forEach((hour, idx) => {
            const item = dayData[hour];
            const slot = document.createElement('div');
            slot.className = "slot-card";
            slot.innerHTML = `
              <div class="slot-time-col">
                <span class="slot-number">${idx + 1}ª Ora</span>
                <span class="slot-hours">${String(hour).padStart(2, '0')}:00 - ${String(parseInt(hour) + 1).padStart(2, '0')}:00</span>
              </div>
              <div class="slot-info-col">
                <div class="slot-subject">${item.subject}</div>
                <div class="slot-room">📍 ${item.room}</div>
              </div>
            `;
            daySection.appendChild(slot);
          });
        }
        container.appendChild(daySection);
      }
    }

    setInterval(updateDisplay, 1000);
    updateDisplay();
  </script>
</body>
</html>
